# Supabase settings read by the GitHub integration (Project Settings → Integrations).
# On every merge to main, Supabase applies any new file in supabase/migrations to the
# live project. Per Supabase's docs, auth, API and seed settings here are NOT applied
# to the live project; only migrations (and declared edge functions / storage buckets).
project_id = "PROJECT-HLITH"

# Server functions deployed by the GitHub integration on merge to main.
[functions.gacha-import]
verify_jwt = true

# Endfield pull history import (E4): reads history from the in-game link, contacting only
# Endfield's own history hosts. Signed-in users only (checked in the function).
[functions.endfield-gacha-import]
verify_jwt = true

# Reads your own HoYoLAB data (stamina, check-in, characters, endgame) and manages saved
# HoYoLAB accounts. Signed-in users only (checked in the function).
[functions.hoyolab]
verify_jwt = true

# Automatic daily check-in and code redemption: started by the daily schedule with the
# service key, so the platform's user-token check is off and the function checks the key itself.
[functions.hoyolab-daily]
verify_jwt = false

# Assistant: runs one chat turn with the caller's own Claude API key (sent per
# request, never stored). The function checks the signed-in user itself.
[functions.assistant]
verify_jwt = true

# Nightly backup: started by the schedule with the service key, so the platform's
# user-token check is off and the function checks the key itself.
[functions.backup]
verify_jwt = false

# Reads the caller's own SKPort data (stamina, check-in, account level) for Arknights: Endfield.
# Signed-in users only (checked in the function).
[functions.skport]
verify_jwt = true

# SKPort daily check-in for Endfield (like hoyolab-daily); the scheduler calls it with the service key.
[functions.skport-daily]
verify_jwt = false

# Code list refresh: fetches hoyo-codes every 4 hours so new codes are tried sooner; the scheduler calls it with the service key.
[functions.codes-refresh]
verify_jwt = false

# Finishes account deletions after the 30-day grace period (T11); the scheduler calls it with the service key.
[functions.purge-accounts]
verify_jwt = false

# Private bucket for the nightly backups (never public).
[storage.buckets.backups]
public = false

# Profile pictures and banners (Account → Profile). Public read so they show with a plain
# link; writes only into your own folder <user id>/… (storage policies in 0004_profile.sql).
[storage.buckets.avatars]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif"]

# Owner-only themes (T47): private, owners only (storage policies in 0010_owner_themes.sql).
# Holds the owner themes' manifest and the owner's own pictures; never public.
[storage.buckets.owner-themes]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/svg+xml", "application/json"]

# Export my data (R56) and Delete my account (R57): signed-in users only (checked in the function).
[functions.export-data]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Evening message (R51): signed-in users only.
[functions.evening-message]
verify_jwt = true

# Calendar feed (R52): calendar apps can't sign in, so the platform check is off and
# the long random token in the link is checked by the function itself.
[functions.ics-feed]
verify_jwt = false

# The scheduler (one entry point for every fixed job): started every 15 minutes by the
# database cron job in 0005_scheduler.sql with the Vault key scheduler_key, or by an owner
# ("Run now"). The function checks the key / owner itself, so the platform check is off.
[functions.scheduler]
verify_jwt = false

# Findings intake: the external routine delivers findings with its own narrow key
# (header x-intake-key, Vault secret findings_intake_key), checked by the function itself.
[functions.findings-intake]
verify_jwt = false
