# Keeps the game lists current by itself (SCHEDULER, T6/T7; docs/ROUTINES.md).
#
# Every 2 hours it asks `node scripts/schedule-due.ts` whether now is a check time
# (counted from patch day: scripts/schedule/rhythm.ts). Most runs stop there.
# GitHub often runs the timer late (gaps of 5-8+ hours), so a check counts as due
# until a run has imported after its time: the workflow looks up the start of the
# last run in which EVERY import succeeded (scripts/last-import.ts, read-only, with its
# own token) and passes it
# as --since; only checks from the last 72 hours count. If that lookup fails, the
# old rule is used: due for 8 hours after its time (--window 8h).
# When a check is due (or someone starts it by hand):
#   1. re-imports leaks and characters, leak kits, and versions/banners/events/endgame
#      (HSR/ZZZ; Arknights Endfield from its official news and endfield.wiki.gg);
#   2. runs the full check (lint, types, unit tests, build, browser tests) on the result;
#   3. puts the changes on ONE standing PR (branch scheduler/auto-data) with a plain summary;
#   4. merges it by itself only when every changed file is a data list
#      (src/games/*/data/*.json or scripts/schedule/rhythm.json), the check is green
#      and every import succeeded. Anything else waits for MANAGER; a failed import is
#      named as an error on the run, and the run ends red;
#   5. reports the run, its findings and the next check time to the owner's inbox
#      (findings-intake, with the FINDINGS_INTAKE_KEY secret).
# Pushes and the PR use the DATA_REFRESH_TOKEN secret, so the PR's own CI runs (main requires
# its `check`); the Action waits for it before merging. Without that secret the PR waits for MANAGER.
name: Data refresh

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Read-only: to find when the last import ran ("Is a check due?").
  actions: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  BRANCH: scheduler/auto-data
  INTAKE_URL: https://qywvnvwfsknfcxgpbivo.supabase.co/functions/v1/findings-intake

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Pushes with DATA_REFRESH_TOKEN start CI on the PR like any person's push would.
          token: ${{ secrets.DATA_REFRESH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: When did the last import run?
        id: last
        # Never fails the job: no answer means the 8-hour window rule below.
        # A run counts only when every import succeeded (its "All imports succeeded" step ran): scripts/last-import.ts.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/last-import.ts

      - name: Is a check due?
        id: plan
        run: |
          node scripts/schedule-due.ts --since "${{ steps.last.outputs.since }}" --lookback 72h --window 8h
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else grep -q '^due=true' "$GITHUB_OUTPUT" && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.plan.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.plan.outputs.go == 'true'
        run: npm ci

      # Each import may fail on its own (a source down or changed); the others still run.
      - name: Leaks and characters (nanoka.cc)
        id: nanoka
        if: steps.plan.outputs.go == 'true'
        continue-on-error: true
        run: npm run data:nanoka
      - name: Kits, leaks included
        id: kits
        if: steps.plan.outputs.go == 'true'
        continue-on-error: true
        run: npm run data:kits && npm run data:hsr-kits
      - name: Versions, banners, events, endgame (official notices + wiki)
        id: schedule
        if: steps.plan.outputs.go == 'true'
        continue-on-error: true
        run: npm run data:schedule

      - name: Arknights Endfield (official news + endfield.wiki.gg)
        id: endfield
        if: steps.plan.outputs.go == 'true' && hashFiles('src/games/endfield/contract.ts') != ''
        continue-on-error: true
        # Kit text too: a new operator's kit appears once endfield.wiki.gg publishes their page.
        run: npm run data:endfield && npm run data:endfield-kits

      # Runs only when every import above succeeded. The imports carry on after an error, so GitHub reports
      # them as "success" either way; this step is what "When did the last import run?" looks for. A run
      # without it keeps its checks due, so the next timer run retries the failed import.
      - name: All imports succeeded
        id: imports
        if: steps.plan.outputs.go == 'true' && steps.nanoka.outcome == 'success' && steps.kits.outcome == 'success' && steps.schedule.outcome == 'success' && (steps.endfield.outcome == 'success' || steps.endfield.outcome == 'skipped')
        run: echo "Every import succeeded."

      - name: What changed
        id: diff
        if: steps.plan.outputs.go == 'true'
        run: |
          files=$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          deleted=$(git diff --name-only --diff-filter=D)
          echo "$files"
          if [ -z "$files" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Only changed or new data lists merge by themselves; a deleted file always goes to MANAGER.
          if [ -n "$deleted" ] || echo "$files" | grep -qvE '^src/games/[^/]+/data/[^/]+\.json$|^scripts/schedule/rhythm\.json$'; then
            echo "data_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Full check
        id: check
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          npm run check
          npx playwright install --with-deps chromium
          CI=true npm run e2e

      - name: Summary and inbox report
        if: steps.plan.outputs.go == 'true'
        run: |
          failed=()
          [ "${{ steps.nanoka.outcome }}" = "failure" ] && failed+=(--failed "leaks-scan: the nanoka.cc import failed (see the Data refresh run on GitHub)")
          [ "${{ steps.kits.outcome }}" = "failure" ] && failed+=(--failed "game-data-refresh: the kit import failed (see the Data refresh run on GitHub)")
          [ "${{ steps.schedule.outcome }}" = "failure" ] && failed+=(--failed "events-scan: the notices/wiki import failed (see the Data refresh run on GitHub)")
          [ "${{ steps.endfield.outcome }}" = "failure" ] && failed+=(--failed "events-scan: the Endfield import (official news + endfield.wiki.gg) failed (see the Data refresh run on GitHub)")
          if [ "${{ steps.check.outcome }}" = "failure" ]; then
            failed+=(--failed "game-data-refresh: the refreshed lists did not pass the check; PR on $BRANCH waits for SCHEDULER")
          fi
          node scripts/data-report.ts --summary "$RUNNER_TEMP/summary.md" --intake "$RUNNER_TEMP/intake.json" --next "${{ steps.plan.outputs.next }}" "${failed[@]}"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Standing PR, merged when data only and green
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add -A
          git commit -q -m "Data refresh $(date -u +%Y-%m-%d): lists from the official notices, wiki and nanoka.cc" -m "$(cat "$RUNNER_TEMP/summary.md")"
          git push -f origin "$BRANCH"
          {
            echo "Automatic data refresh (.github/workflows/data-refresh.yml, run ${{ github.run_id }})."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Data files only: ${{ steps.diff.outputs.data_only }} · full check: ${{ steps.check.outcome }} · all imports: ${{ steps.imports.outcome == 'success' && 'succeeded' || 'NOT all succeeded (see the run)' }}"
          } > "$RUNNER_TEMP/body.md"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --head "$BRANCH" --base main --title "Data refresh (automatic)" --body-file "$RUNNER_TEMP/body.md"
            pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          fi
          # A failed import never merges by itself, even when its partial lists pass the check: it waits, named.
          if [ "${{ steps.diff.outputs.data_only }}" = "true" ] && [ "${{ steps.check.outcome }}" = "success" ] && [ "${{ steps.imports.outcome }}" = "success" ]; then
            # main requires CI's `check`, which runs on the PR because this push and PR come from
            # DATA_REFRESH_TOKEN (the built-in token starts no CI). Wait for it, then merge.
            if [ "$HAS_TOKEN" != "true" ]; then
              echo "::warning::DATA_REFRESH_TOKEN is not set: CI does not start on PR #$pr, so it waits for MANAGER."
            else
              # Wait (up to 15 min) until the required `check` shows up on the PR (it starts after the
              # unit and browser tests), then watch it.
              for _ in $(seq 1 90); do
                gh pr checks "$pr" --required 2>/dev/null | grep -qw check && break
                sleep 10
              done
              if gh pr checks "$pr" --required --watch --interval 30 >/dev/null; then
                gh pr merge "$pr" --squash --delete-branch || echo "::warning::PR #$pr could not merge by itself; it waits for MANAGER."
              else
                echo "::warning::CI did not pass for PR #$pr; it waits for MANAGER."
              fi
            fi
          else
            echo "::warning::PR #$pr waits for MANAGER (data only: ${{ steps.diff.outputs.data_only }}, check: ${{ steps.check.outcome }})."
          fi

      - name: Report to the owner's inbox
        if: always() && steps.plan.outputs.go == 'true'
        env:
          KEY: ${{ secrets.FINDINGS_INTAKE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::FINDINGS_INTAKE_KEY is not set; nothing sent to the inbox."; exit 0; fi
          [ -f "$RUNNER_TEMP/intake.json" ] || { echo "No report was made."; exit 1; }
          code=$(curl -sS -o "$RUNNER_TEMP/answer.json" -w '%{http_code}' -X POST "$INTAKE_URL" \
            -H 'Content-Type: application/json' -H "x-intake-key: $KEY" --data-binary @"$RUNNER_TEMP/intake.json")
          cat "$RUNNER_TEMP/answer.json"; echo
          [ "$code" = "200" ]

      # A failed import or check shows as a failed run (GitHub emails the owner), after the report.
      - name: Result
        if: steps.plan.outputs.go == 'true'
        run: |
          bad=0
          for pair in "Leaks and characters (nanoka.cc)=${{ steps.nanoka.outcome }}" "Kits, leaks included=${{ steps.kits.outcome }}" \
                      "Versions, banners, events, endgame=${{ steps.schedule.outcome }}" "Arknights Endfield=${{ steps.endfield.outcome }}" \
                      "Full check=${{ steps.check.outcome }}"; do
            # A failed step is named on the run page, so stale lists can't pass unnoticed.
            if [ "${pair##*=}" = "failure" ]; then echo "::error::${pair%=*} failed: its lists were not refreshed (or did not pass). The next timer run retries the import."; bad=1; fi
          done
          exit $bad
